<svg xmlns="http://www.w3.org/2000/svg" id="s" viewBox="0 0 16 16" shape-rendering="crispEdges"><style>*{animation-timing-function:steps(1,end)!important;animation-iteration-count:infinite!important}.f{transform-box:fill-box}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(1px)}}@keyframes hop{0%{transform:translateY(0)}20%{transform:translateY(-2px)}45%{transform:translateY(-3px)}70%{transform:translateY(-1px)}85%{transform:translateY(0)}}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}@keyframes sway{0%{transform:translateX(0)}50%{transform:translateX(1px)}}@keyframes blink{0%{opacity:1}92%{opacity:0}96%{opacity:1}}@keyframes on1{0%{opacity:0}33%{opacity:1}}@keyframes on2{0%{opacity:0}34%{opacity:1}}@keyframes on3{0%{opacity:0}66%{opacity:1}}@keyframes flick{0%{opacity:1}50%{opacity:.25}}@keyframes flick2{0%{opacity:.25}50%{opacity:1}}@keyframes pop{0%{transform:translateY(1px);opacity:.4}20%{transform:translateY(0);opacity:1}}@keyframes armdn{0%{transform:translateY(0)}50%{transform:translateY(3px)}}@keyframes armdn2{0%{transform:translateY(3px)}50%{transform:translateY(0)}}@keyframes rise{0%{transform:translate(0,2px);opacity:0}20%{transform:translate(0,1px);opacity:1}60%{transform:translate(1px,-1px);opacity:1}85%{transform:translate(1px,-2px);opacity:0}}@keyframes steam{0%{transform:translateY(1px);opacity:0}25%{transform:translateY(0);opacity:1}75%{transform:translateY(-1px);opacity:1}90%{transform:translateY(-2px);opacity:0}}@keyframes scan{0%{transform:translateX(-3px)}40%{transform:translateX(-1px)}70%{transform:translateX(0)}}@keyframes waveup{0%{transform:translate(0,-1px)}50%{transform:translate(0,-2px)}}@keyframes conf{0%{transform:translateY(-2px);opacity:0}15%{opacity:1}100%{transform:translateY(6px);opacity:0}}@keyframes spin{0%{opacity:1}40%{opacity:.3}}@keyframes c1{0%{opacity:1}25%{opacity:0}}@keyframes c2{0%{opacity:0}25%{opacity:1}50%{opacity:0}}@keyframes c3{0%{opacity:0}50%{opacity:1}75%{opacity:0}}@keyframes c4{0%{opacity:0}75%{opacity:1}}@keyframes flip{0%{opacity:1}50%{opacity:0}}.bob{animation:bob 1.6s}.slow{animation:bob 2.6s}.hop{animation:hop .8s}.shake{animation:shake .28s}.sway{animation:sway 1.4s}.eyes{animation:blink 4.2s}.d1{animation:on1 1.5s}.d2{animation:on2 1.5s}.d3{animation:on3 1.5s}.fl{animation:flick .5s}.fl2{animation:flick2 .5s}.pop{animation:pop 1.6s}.al{animation:armdn .3s}.ar{animation:armdn2 .3s}.z1{animation:rise 2.4s}.z2{animation:rise 2.4s -1.2s}.st1{animation:steam 1.6s}.st2{animation:steam 1.6s -.8s}.scan{animation:scan 2s}.wv{animation:waveup .45s}.cf{animation:conf 1.4s}.sp{animation:spin .8s}.k1{animation:c1 2s}.k2{animation:c2 2s}.k3{animation:c3 2s}.k4{animation:c4 2s}.fp{animation:flip 1.2s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}svg:target *{animation:none!important}</style><g class="f slow"><path fill="#da7758" d="M4 6h8v1h-8zM4 7h8v1h-8zM2 8h12v1h-12zM2 9h12v1h-12zM4 10h8v1h-8zM4 11h8v1h-8zM4 12h1v1h-1zM6 12h1v1h-1zM9 12h1v1h-1zM11 12h1v1h-1zM4 13h1v1h-1zM6 13h1v1h-1zM9 13h1v1h-1zM11 13h1v1h-1z"/><g class="eyes"><path fill="#000000" d="M5 8h1v1h-1zM10 8h1v1h-1z"/></g><path fill="#D9B38C" d="M3 10h3v1h-3zM10 10h3v1h-3zM3 11h10v1h-10zM3 12h1v1h-1zM12 12h1v1h-1zM3 13h10v1h-10z"/><path fill="#8B5A3C" d="M4 12h8v1h-8z"/></g></svg>